name: Deploy Urulakkuperi & Journal to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (Chatbot Web App)
        uses: actions/checkout@v4

      - name: Checkout journal branch (TinkerHub Journal)
        uses: actions/checkout@v4
        with:
          ref: journal
          path: temp_journal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Chatbot App
        run: npm run build

      - name: Mount Journal Website into dist/journal/
        run: |
          mkdir -p dist/journal
          cp -r temp_journal/* dist/journal/
          rm -rf dist/journal/.git
          touch dist/.nojekyll
          touch dist/journal/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
